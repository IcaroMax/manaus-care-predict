services:
  db:
    image: postgres:15-alpine
    container_name: prevsus-postgres
    restart: always
    environment:
      POSTGRES_USER: prevsus
      POSTGRES_PASSWORD: prevsus_password
      POSTGRES_DB: prevsus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prevsus -d prevsus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prevsus-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://prevsus:prevsus_password@db:5432/prevsus_db
      PROJECT_NAME: "PrevSUS Backend"
      API_V1_STR: "/api/v1"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080","http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
